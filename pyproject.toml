[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-pow-difficulty-retarget-lab"
version = "0.1.0"
description = "Evaluate bounded synthetic difficulty retargets using epoch duration, clamping and work estimates."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-pow-difficulty-retarget-lab = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
